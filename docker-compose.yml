services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guara}
      POSTGRES_DB: ${POSTGRES_DB:-guara}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicação completa (produção / homologação): docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guara}:${POSTGRES_PASSWORD:-guara}@db:5432/${POSTGRES_DB:-guara}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
